<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Arrow Generator Plugin</title>
    <!-- Tailwind CSS for fast UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for zipping files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .image-card canvas {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
        }
        .canvas-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9fafb;
            border-radius: 0.25rem;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Bulk Arrow Generator</h1>
                <p class="text-gray-600 mt-2">Upload images, automatically detect cups, and draw dimension arrows.</p>
            </div>
            <button id="download-all-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-md font-semibold hidden transition">
                Download All (ZIP)
            </button>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
            <div class="flex items-center justify-center w-full">
                <label for="file-upload" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                        <p class="text-xs text-gray-500">PNG, JPG up to 10MB (Bulk upload allowed)</p>
                    </div>
                    <input id="file-upload" type="file" class="hidden" multiple accept="image/*" />
                </label>
            </div>
        </div>

        <div id="loading" class="hidden text-center my-8">
            <div class="inline-block animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full"></div>
            <p class="mt-2 text-gray-600">Processing images...</p>
        </div>

        <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Processed images will appear here -->
        </div>
    </div>

    <script src="js/arrow-plugin.js"></script>
</body>
</html>
